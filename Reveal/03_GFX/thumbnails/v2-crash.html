<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../brand.css"><style>

body { width: 1280px; height: 720px; background: var(--ink); }
h1 { position: absolute; left: 64px; top: 70px; font-weight: 700; font-size: 150px; line-height: .92; letter-spacing: -0.055em; color: var(--paper); }
h1 em { font-style: normal; color: var(--terracotta); }
.win { position: absolute; left: 580px; top: 262px; width: 780px; height: 320px; background: var(--white); box-shadow: 0 40px 90px rgb(0 0 0 / .55); overflow: hidden; transform: rotate(-2deg); }

.mark { position: absolute; right: 56px; bottom: 56px; width: 84px; height: 84px; }

<h1>Crash?<br><em>Fixed.</em></h1>
