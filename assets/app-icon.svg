<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Terracotta Background Square with 2px radius aesthetic (scaled to 16px) -->
  <rect width="512" height="512" rx="32" ry="32" fill="#C15F3C" />
  
  <!-- Subtle terrain cut grid lines -->
  <line x1="64" y1="384" x2="448" y2="384" stroke="#A9512F" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Minimalist 'L' mark in Paper (#F4F3EE) -->
  <path d="M 148 112 
           L 220 112 
           L 220 336 
           L 364 336 
           L 364 400 
           L 148 400 
           Z" 
        fill="#F4F3EE" />

  <!-- Geometric terrain cut inside the L-corner -->
  <rect x="220" y="304" width="32" height="32" fill="#C15F3C" />
</svg>
