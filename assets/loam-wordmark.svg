<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- LOAM mark v2 (1.7.0): rounded tile, soil-layer contours, the stepped L. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D77A52"/>
      <stop offset="0.55" stop-color="#C15F3C"/>
      <stop offset="1" stop-color="#9A462A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="6" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="256" height="256" rx="60"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="256" height="256" fill="url(#tile)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.13">
      <path d="M-10 74 C 50 56, 110 92, 170 70 S 250 58, 270 66"/>
      <path d="M-10 214 C 60 196, 120 230, 180 208 S 250 198, 270 204"/>
      <path d="M-10 238 C 60 222, 130 252, 190 232 S 252 224, 270 228"/>
    </g>
    <rect width="256" height="128" fill="url(#sheen)"/>
  </g>
  <rect x="2" y="2" width="252" height="252" rx="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
  <path filter="url(#lift)" d="M68 50h44v112h32v-22h48v64H68z" fill="#F7F4EC" stroke="#F7F4EC" stroke-width="10" stroke-linejoin="round"/>
</svg>
