[package]
name = "loam"
version = "1.9.0"
description = "Your worlds, ready."
edition = "2021"

[lib]
name = "loam_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "rustls-tls", "multipart"], default-features = false }
png = "0.17"
uuid = { version = "1", features = ["v4", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
url = "2"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
sysinfo = "0.33"
walkdir = "2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
tempfile = "3"
